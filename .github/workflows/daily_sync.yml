name: Daily NetEase to Apple Music Sync

on:
  schedule:
    # 每天 UTC 时间 22:30 (即北京时间次日早上 06:30) 运行
    - cron: '30 22 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Music Sync
        env:
          NCM_MUSIC_U: ${{ secrets.NCM_MUSIC_U }}
          AM_DEVELOPER_TOKEN: ${{ secrets.AM_DEVELOPER_TOKEN }}
          AM_MUSIC_USER_TOKEN: ${{ secrets.AM_MUSIC_USER_TOKEN }}
          AM_STOREFRONT: ${{ vars.AM_STOREFRONT || 'cn' }}
          SYNC_MODE: ${{ vars.SYNC_MODE || 'archive' }}
          PLAYLIST_OVERWRITE_NAME: ${{ vars.PLAYLIST_OVERWRITE_NAME || '网易云每日推荐' }}
          PLAYLIST_ARCHIVE_PREFIX: ${{ vars.PLAYLIST_ARCHIVE_PREFIX || '网易云日推 - ' }}
        run: |
          python main.py sync
